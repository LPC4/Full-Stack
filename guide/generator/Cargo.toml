[package]
name = "full_stack_guide"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "full_stack_guide"
path = "src/main.rs"

[dependencies]
fs_utils = { path = "../../crates/fs-utils" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[lints]
workspace = true
