name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Choose the runner to use'
        type: choice
        required: false
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

jobs:
  check-and-test:
    name: Lint, Check, and Test
    runs-on: ${{ inputs.runner || vars.RUNNER_TYPE || 'ubuntu-latest' }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Full-Stack WASM target
        run: cargo check -p full_stack --all-features --lib --target wasm32-unknown-unknown

      - name: Check Guide WASM target
        run: cargo check -p full_stack_guide_wasm --all-features --target wasm32-unknown-unknown

      - name: Test workspace
        run: cargo test --workspace
